{% extends "layouts/base.html" %}

{% block title %}
Lab 8 Task 7
{% endblock %}

{% block content %}

<h2 style="text-align:center;">
    Number of Students in Each City
</h2>

<div style="
width:60%;
margin:auto;
padding:20px;
font-size:24px;
">

{% for city in cities %}

    <div style="
        border:2px solid #333;
        border-radius:10px;
        padding:15px;
        margin-bottom:15px;
    ">

        <strong>City:</strong> {{ city.city }}
        <br>

        <strong>Students:</strong>
        {{ city.student_count }}

    </div>

{% endfor %}

</div>

{% endblock %}
