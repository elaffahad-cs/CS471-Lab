{% extends "layouts/base.html" %}

{% block title %}
Delete Book
{% endblock %}

{% block content %}

<h2>Delete Book</h2>

<p>
    Are you sure you want to delete:
</p>

<p>
    <strong>{{ book.title }}</strong>
</p>

<form method="POST">

    {% csrf_token %}

    <button type="submit">
        Confirm Delete
    </button>

    <a href="{% url 'books.lab10.list' %}">
        Cancel
    </a>

</form>

{% endblock %}
